<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="pistachio-title pistachio-desc">
  <title id="pistachio-title">Nibby Gelato — Pistachio My Love packaging concept</title>
  <desc id="pistachio-desc">Original vector concept, not a product photograph or confirmed packaging. A softly dimensional 140 ml tapered paper tub has a pistachio-green wrap and bold lowercase nibby lettering. A slightly tilted lid floats above an elliptical rim of folded green gelato, accompanied by two quiet pistachio sketches. Transparent background.</desc>
