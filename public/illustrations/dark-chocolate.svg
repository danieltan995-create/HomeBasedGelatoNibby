  <title id="cocoa-title">Nibby Gelato — Dark Chocolate packaging concept</title>
  <desc id="cocoa-desc">Original vector concept, not a product photograph or confirmed packaging. An elevated view of a tapered 140 ml paper tub in cocoa brown with ivory nibby lettering. A gently hovering, tilted lid reveals chocolate gelato ribbons inside the elliptical rim. Small cocoa and chocolate doodles frame a transparent canvas.</desc>
