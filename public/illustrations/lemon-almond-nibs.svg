  <title id="lemon-title">Nibby Gelato — Lemon Almond Nibs packaging concept</title>
  <desc id="lemon-desc">Original vector concept, not a product photograph or confirmed packaging. A softly shaded, tapered 140 ml paper tub with a muted yellow wrap and playful nibby lettering. A tilted paper lid hovers above lemon gelato folds; a lemon wedge and almond sketches sit beside the cup. Transparent background.</desc>
